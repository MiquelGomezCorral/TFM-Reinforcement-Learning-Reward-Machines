# Default configuration for TFM project
exp_name: "base_name"
exp_description: "base_description"
rm_file: "rm_taxi_2p.txt"
seed: 42
gym_id: "MultiTaxi-v0"
video_fps: 1

# Training parameters
n_training_episodes: 20000  # Total training episodes
learning_rate: 0.7  # Learning rate

# Evaluation parameters
n_eval_episodes: 200  # Total number of test episodes

# Environment parameters
max_steps: 99  # Max steps per episode
gamma: 0.95  # Discounting rate
use_rm: true  # Whether to use the RM or not
use_crm: false  # Whether to use the CRM or not
multitaxi_grid_size: 5
multitaxi_num_passengers: 2
multitaxi_observation_mode: "discrete"

# Exploration parameters
max_epsilon: 1.0  # Exploration probability at start
min_epsilon: 0.05  # Minimum exploration probability
decay_rate: 0.0005  # Exponential decay rate for exploration prob
qtable_learning_starts: 1000

# HRM parameters
hrm_r_plus: 1
hrm_r_minus: 0
hrm_q_init: 0  # Use 2 for the paper's optimistic initialization

# DQN parameters
dqn_batch_size: 128
dqn_replay_capacity: 100000
dqn_learning_rate: 0.001
dqn_hidden_size: 128
dqn_tau: 0.01
dqn_gradient_clip: 10
dqn_epsilon_decay_steps: 50000
dqn_optimize_interval: 4
dqn_learning_starts: 1000
dqn_optimize_starts: 1000
